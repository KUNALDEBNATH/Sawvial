<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title data-i18n="nav.ask">Ask SAWVIAL</title>
<meta name="theme-color" content="#faf8f2" />
<meta name="description" content="Ask SAWVIAL a farming question by voice or text and get a clear, research-based answer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/chat.css?v=20261010-context-eval" />
</head>
<body class="chat">

<div class="scrim" id="scrim"></div>

<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="side" id="side" aria-label="Chat history">
    <div class="side-top">
      <a href="index.html" class="side-brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21.5C12 21.5 4.5 16.6 4.5 10.3C4.5 5.9 7.9 2.5 12 2.5C16.1 2.5 19.5 5.9 19.5 10.3C19.5 16.6 12 21.5 12 21.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 17.5V7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 11C12 11 8.8 10.4 8.8 7.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        SAWVIAL
      </a>
      <button class="icon-btn" id="close-side" data-i18n-aria="chat.closeMenu" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span data-i18n="chat.new">New question</span>
    </button>

    <div class="side-search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="history-search" data-i18n-ph="chat.search" data-i18n-aria="chat.search" placeholder="Search your questions" aria-label="Search your questions" />
    </div>

    <div class="history" id="history"></div>

    <div class="side-foot">
      <a class="side-link" href="language.html?redirect=ask.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" stroke="currentColor" stroke-width="1.5"/></svg>
        <span data-i18n="nav.language">Language</span>
        <small data-current-language>English</small>
      </a>
      <a class="side-link" href="help.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
        <span data-i18n="footer.howto">How to use</span>
      </a>
      <a class="side-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="chat.backHome">Back to home</span>
      </a>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" data-i18n-aria="nav.menu" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="topbar-title" id="chat-title">New question</span>
      <span class="spacer"></span>
      <a class="lang-pill" href="language.html?redirect=ask.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" stroke="currentColor" stroke-width="1.5"/></svg>
        <span data-current-language>Choose language</span>
      </a>
    </header>

    <div class="thread" id="thread"></div>

    <div class="composer-wrap">
      <form class="composer" id="composer" onsubmit="return false;">
        <textarea id="input" rows="1" data-i18n-ph="chat.placeholder" data-i18n-aria="chat.yourQuestion" placeholder="Ask about crops, soil, water or pests…" aria-label="Your question"></textarea>

        <div class="rec-bar">
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="rec-label" id="rec-label" data-i18n="chat.listening">Listening…</span>
        </div>

        <button type="button" class="round mic" id="mic-btn" data-i18n-aria="chat.mic" aria-label="Speak your question">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <button type="button" class="round send" id="send-btn" data-i18n-aria="chat.send" aria-label="Send question" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="composer-hint" data-i18n="chat.hint">Guidance is general and research-based.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/script.js?v=20261010-context-eval"></script>
<script src="js/i18n.js?v=20261010-context-eval"></script>
<script src="js/sawvial-api.js?v=20261010-context-eval"></script>
<script src="js/chat.js?v=20261010-context-eval"></script>
</body>
</html>
